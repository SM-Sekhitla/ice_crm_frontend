<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171719" />
    <title>You're offline · CRM</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; padding: 24px; display: grid; place-items: center; background: #171719; color: #222023; font: 16px/1.6 system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 36px 28px; border-radius: 24px; background: #fff; box-shadow: 0 20px 60px #0004; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 26px; letter-spacing: -0.8px; margin: 20px 0 10px; }
      p { color: #767278; }
      a { display: block; text-align: center; background: #c1121f; color: #fff; border-radius: 10px; padding: 13px 18px; text-decoration: none; font-weight: 600; margin-top: 28px; }
      small { display: block; color: #767278; margin-top: 20px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="CRM" />
      <h1>Let's reconnect.</h1>
      <p>Connect to the internet to open your workspace and load the latest contacts, meetings and opportunities.</p>
      <a href="/">Try again</a>
      <small>CRM needs a connection to view and save your records.</small>
    </main>
  </body>
</html>
